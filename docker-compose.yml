services:
  papercut:
    image: changemakerstudiosus/papercut-smtp:7.8.0
    container_name: papercut
    ports:
      - "8080:8080"
      - "2525:2525"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ohtohsbglist
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Smtp__Host=papercut
    volumes:
      - ./src/OhtohsBGList/BoardGames.db:/app/BoardGames.db
      - ./src/OhtohsBGList/BoardGames.db-shm:/app/BoardGames.db-shm
      - ./src/OhtohsBGList/BoardGames.db-wal:/app/BoardGames.db-wal
      - ./src/OhtohsBGList/App_Data:/app/App_Data
    depends_on:
      - papercut
    restart: unless-stopped

