<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your password reset code</title>
</head>
<body style="margin:0; padding:32px 16px; background-color:#f1f5f9; font-family:Segoe UI, Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0"
                       style="max-width:480px; width:100%; background-color:#ffffff; border-radius:12px; box-shadow:0 1px 3px rgba(15,23,42,0.08); overflow:hidden;">
                    <tr>
                        <td style="background-color:#2563eb; padding:24px 32px;">
                            <span style="color:#ffffff; font-size:20px; font-weight:600;">MyBGList</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            <h1 style="margin:0 0 16px; font-size:20px; color:#0f172a;">Your password reset code</h1>
                            <p style="margin:0 0 16px; font-size:15px; line-height:1.6; color:#334155;">
                                Hi {{ user_name }}, use the code below to reset your password. This code
                                expires shortly, so use it soon.
                            </p>
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
                                <tr>
                                    <td style="padding:16px 24px; border-radius:8px; background-color:#eff6ff; border:1px dashed #93c5fd;">
                                        <span style="font-size:24px; font-weight:700; letter-spacing:4px; color:#1d4ed8;">{{ reset_code }}</span>
                                    </td>
                                </tr>
                            </table>
                            <p style="margin:0; font-size:13px; line-height:1.6; color:#64748b;">
                                If you didn't request a password reset, you can safely ignore this email.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:20px 32px; background-color:#f8fafc; border-top:1px solid #e2e8f0;">
                            <p style="margin:0; font-size:12px; color:#94a3b8;">
                                This code was requested for your MyBGList account.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
